spring.application.name=movie-booking-system
server.port=8080

# Database configuration placeholders (update with your actual MySQL database credentials)
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Frontend URL configuration (Vite development server default port)
app.frontend-url=http://localhost:5173

